<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chores">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Chore Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0; --card:#FFFFFF; --ink:#1F1B2E; --muted:#6B6880; --line:#EEE8F5;
  --accent:#7C5CFF; --good:#16A34A; --warn:#EA580C; --bad:#DC2626; --gold:#F5B300;
  --r:20px; --shadow:0 2px 0 rgba(31,27,46,.04),0 8px 24px rgba(31,27,46,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
body{background:radial-gradient(1200px 500px at 10% -10%,#FFE7D1 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#E9E2FF 0,transparent 55%),var(--bg);min-height:100vh}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.brand{font-family:Fredoka;font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.brand small{font-family:Nunito;font-weight:700;color:var(--muted);font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow);font-size:18px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-weight:800;border:2px solid transparent}
.tab .av{width:30px;height:30px;font-size:17px}
.tab.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 10%,#fff)}
.tab.plain{padding:8px 14px}
.av{border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff);border:2px solid var(--c);flex:0 0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#FF8A3D));}
.hero .row1{display:flex;align-items:center;gap:14px}
.hero .big{width:64px;height:64px;font-size:36px;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7)}
.hero h2{margin:0;font-size:28px;line-height:1}
.hero .sub{opacity:.92;font-weight:700;margin-top:4px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:Fredoka;font-size:22px;line-height:1.1}
.stat span{font-size:12px;font-weight:700;opacity:.9}
.money{margin-top:12px;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.money .lbl{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFE066,#FFB703);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.light{background:#F1ECF8}
.bar.light i{background:linear-gradient(90deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 60%,#FFB703))}
.week{display:flex;align-items:center;gap:6px}
.week .arrow{width:32px;height:56px;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-weight:800;color:var(--muted)}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:#fff;border-radius:14px;padding:6px 0 7px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent;position:relative}
.day .dn{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.day .dd{font-family:Fredoka;font-weight:600;font-size:18px;line-height:1.2}
.day .dot{width:22px;height:5px;border-radius:9px;margin:2px auto 0;background:#EEE}
.day .dot.part{background:linear-gradient(90deg,var(--c) var(--p),#EEE var(--p))}
.day .dot.full{background:var(--good)}
.day.sel{border-color:var(--c,var(--accent))}
.day.today .dd{color:var(--c,var(--accent))}
.day.future{opacity:.55}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px}
.sec h3{margin:0;font-size:19px}
.sec .meta{font-size:13px;font-weight:800;color:var(--muted)}
.chore{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 12px 12px 14px;box-shadow:var(--shadow);margin-bottom:9px;border:2px solid transparent;transition:transform .12s, background .2s}
.chore:active{transform:scale(.985)}
.chore .em{font-size:26px;width:34px;text-align:center;flex:0 0 auto}
.chore .tx{flex:1;min-width:0}
.chore .t{font-weight:800;font-size:16px;line-height:1.25}
.chore .n{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.chore .ret{font-size:13px;color:var(--bad);font-weight:800;margin-top:4px}
.chore .pts{font-size:12px;font-weight:800;color:#8A6A00;background:#FFF4CC;border-radius:99px;padding:3px 8px;flex:0 0 auto}
.chk{width:40px;height:40px;border-radius:50%;border:3px solid #D9D3E6;display:grid;place-items:center;flex:0 0 auto;font-size:20px;color:#fff;transition:all .2s}
.chore.done{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:color-mix(in srgb,var(--c) 25%,#fff)}
.chore.done .t{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.chore.done .chk{background:var(--c);border-color:var(--c);animation:pop .35s}
.chore.returned{border-color:#FECACA;background:#FFF7F7}
.chore.locked{opacity:.6}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:160px}
.slot{width:34px;height:34px;border-radius:50%;border:3px solid #D9D3E6;display:grid;place-items:center;font-size:16px;color:#fff;font-weight:800}
.slot.on{background:var(--c);border-color:var(--c);animation:pop .35s}
.slot.other{background:#EEE;border-color:#DDD;font-size:15px}
.slot.ret{border-color:var(--bad);color:var(--bad)}
.allgood{text-align:center;padding:22px 14px;border-radius:18px;background:linear-gradient(135deg,#ECFDF5,#FEF9C3);font-weight:800;margin-bottom:9px}
.allgood .e{font-size:40px}
.empty{color:var(--muted);font-weight:700;text-align:center;padding:16px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:8px}
.badge{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow);font-size:12px;font-weight:800}
.badge .e{font-size:28px;display:block;margin-bottom:2px}
.badge.off{opacity:.38;filter:grayscale(1)}
.kidcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:left;border-top:6px solid var(--c);display:block;width:100%}
.kc .h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kc .h .av{width:44px;height:44px;font-size:24px}
.kc .h b{font-family:Fredoka;font-size:21px}
.kc .h .st{margin-left:auto;font-weight:800;font-size:14px}
.kc .ln{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin:8px 0 4px;color:var(--muted)}
.kc .ln b{color:var(--ink)}
.goal{background:linear-gradient(135deg,#2E1A6B,#7C5CFF 60%,#FF7A59);color:#fff}
.goal h3{margin:0 0 4px;font-size:20px}
.goal .r{font-weight:800;opacity:.95}
.goal .bar{height:16px;margin:12px 0 6px;background:rgba(255,255,255,.2);position:relative;overflow:visible}
.goal .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:3px}
.feed .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed .it:last-child{border-bottom:0}
.feed .it .av{width:32px;height:32px;font-size:17px}
.feed .it .w{flex:1;min-width:0;font-weight:700;font-size:14px}
.feed .it .w small{display:block;color:var(--muted);font-weight:700}
.btn{border-radius:12px;padding:9px 14px;font-weight:800;background:#F3EFFA;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}
.btn.bad{background:#FEE2E2;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{display:block;width:100%;padding:13px;font-size:16px}
.ptabs{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.ptabs button{flex:1;white-space:nowrap;padding:9px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.ptabs button.on{background:var(--accent);color:#fff}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .em{font-size:22px;width:30px;text-align:center}
.prow .tx{flex:1;min-width:0}
.prow .t{font-weight:800}
.prow .n{font-size:12px;color:var(--muted);font-weight:700}
.mv{display:flex;flex-direction:column}
.mv button{font-size:12px;color:var(--muted);padding:1px 6px}
.grp{font-family:Fredoka;font-weight:600;font-size:15px;color:var(--muted);margin:12px 0 0;text-transform:uppercase;letter-spacing:.6px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:800;font-size:13px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:12px;background:#F3EFFA;font-weight:800;font-size:14px;border:2px solid transparent}
.seg button.on{background:color-mix(in srgb,var(--c,var(--accent)) 14%,#fff);border-color:var(--c,var(--accent))}
.step{display:flex;align-items:center;gap:10px}
.step button{width:38px;height:38px;border-radius:12px;background:#F3EFFA;font-weight:800;font-size:20px}
.step b{font-family:Fredoka;font-size:22px;min-width:30px;text-align:center}
.emogrid{display:flex;flex-wrap:wrap;gap:4px}
.emogrid button{width:38px;height:38px;border-radius:10px;font-size:21px}
.emogrid button.on{background:#EDE7FF;outline:2px solid var(--accent)}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.kidedit{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.kidedit .r{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
table.al{width:100%;border-collapse:collapse;font-size:14px}
table.al th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;padding:6px 4px}
table.al td{padding:9px 4px;border-top:1px solid var(--line);font-weight:700;vertical-align:middle}
.paid{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800;background:#F3EFFA;margin-top:3px}
.paid.on{background:#DCFCE7;color:var(--good)}
#modal .bg{position:fixed;inset:0;background:rgba(20,16,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#modal .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 26px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){#modal .bg{align-items:center}#modal .sheet{border-radius:24px}}
#modal h3{margin:0 0 14px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center}
#toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.notice{background:#FFF7ED;border:2px solid #FED7AA;color:#9A3412;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.load{text-align:center;padding:60px 20px;color:var(--muted);font-weight:800}
.spin{width:36px;height:36px;border:4px solid #E9E2FF;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:10px auto}
.pinpad button{height:56px;border-radius:16px;background:#F3EFFA;font-family:Fredoka;font-size:24px;font-weight:600}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pindots i{width:16px;height:16px;border-radius:50%;background:#E5E0EE}
.pindots i.on{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:6px 10px;border-radius:99px;background:#F3EFFA;font-size:13px;font-weight:800}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}

.login{max-width:420px;margin:30px auto;text-align:center}
.login h2{font-size:28px;margin:6px 0 4px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:20px 0}
.who button{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px 8px;font-weight:800;font-size:16px;border-top:5px solid var(--c)}
.who .av{width:58px;height:58px;font-size:32px;margin:0 auto 8px}
.me{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.me .av{width:30px;height:30px;font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script>
// ▼▼▼ Paste your Apps Script Web app URL (ends in /exec) between the quotes ▼▼▼
const API_URL='https://script.google.com/macros/s/AKfycbyXy6CyEbnvW8WAAFex_WDu-rG19LxfK0IudjbjL4jwGMqt7xU1ik_ZdYf-8ZvAy-2JDQ/exec';
// ▲▲▲
const BOOT={who:new URLSearchParams(location.search).get('u')||''};
/* ---------- constants & helpers ---------- */
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const COLORS=['#7C5CFF','#0EA5A4','#F97316','#EC4899','#3B82F6','#22C55E','#E0A800','#EF4444'];
const KID_EMOJI=['🌟','🦋','🦄','🐬','🐱','🐶','🦊','🐼','🐸','🌈','⚡','🎨','⚽','🎸','🌸','🚀','👑','🍉'];
const PARENT_EMOJI=['👨','👩','🧔','👱‍♀️','🧑','👴','👵','😎'];
const CHORE_EMOJI=['🪑','👟','🍽️','🧽','🧺','👕','👚','🛁','🪥','🧻','🛏️','🧹','🗑️','🐕','🌱','📚','🧸','🚿','🪟','🍳','🚗','🧦','✨','💪'];
const RETURN_REASONS=['Not put away all the way','Missed a spot','Not done yet','Let\'s redo it together'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const range=n=>Array.from({length:n},(_,i)=>i);
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>keyOf(new Date());
const dayNum=k=>{const [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fromNum=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const dow=k=>new Date(dayNum(k)*864e5).getUTCDay();
const ws=()=>S.cfg?.settings?.weekStart??0;
const weekKey=k=>fromNum(dayNum(k)-((dow(k)-ws()+7)%7));
const weekDays=wk=>range(7).map(i=>fromNum(dayNum(wk)+i));
const weekIdx=wk=>Math.floor(dayNum(wk)/7);
const shortDate=k=>{const d=new Date(dayNum(k)*864e5);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'})};
const money=v=>'$'+(Math.round(v*100)/100).toFixed(2);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function call(fn,...args){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error('App not connected yet — the API_URL line in index.html needs your /exec link');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',credentials:'omit',signal:ctl.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'Request failed');return j.result;
  }catch(e){if(e.name==='AbortError')throw new Error('Timed out — check your connection');throw e}
  finally{clearTimeout(t)}
}
const errMsg=e=>String(e&&e.message||e||'Something went wrong').replace(/^Error:\s*/,'');

/* ---------- state ---------- */
const S={cred:null,me:null,profiles:null,cfg:null,weeks:{},meta:{},need:new Set(),pend:new Map(),
  view:'family',date:today(),ptab:'chores',modal:null,login:{who:BOOT.who||'',pin:'',bad:'',busy:false},
  slotIdx:new Map(),pending:false,cfgQ:Promise.resolve(),loading:false,offline:false,fetchT:0};

/* ---------- config helpers ---------- */
function norm(c){
  c=c||{};c.kids=c.kids||[];c.chores=c.chores||[];c.parents=c.parents||[];
  c.settings=Object.assign({weekStart:0,goalPct:90,reward:'Family movie night 🍿'},c.settings||{});
  c.kids.forEach((k,i)=>{k.color=k.color||COLORS[i%COLORS.length];k.emoji=k.emoji||'🌟';k.allowance=Number(k.allowance)||0});
  c.chores.forEach(ch=>{ch.freq=ch.freq||'daily';ch.days=Array.isArray(ch.days)?ch.days:[0,1,2,3,4,5,6];ch.times=Math.max(1,Number(ch.times)||1);
    ch.points=Math.max(0,Number(ch.points)||0);ch.assign=ch.assign||{mode:'each',kids:[]};ch.assign.kids=ch.assign.kids||[];ch.assign.mode=ch.assign.mode||'each';ch.assign.start=ch.assign.start||0;ch.emoji=ch.emoji||'✨'});
  return c;
}
const kids=()=>S.cfg?.kids||[];
const kid=id=>kids().find(k=>k.id===id);
const kidName=id=>kid(id)?.name||'Someone';
const choresOf=f=>(S.cfg?.chores||[]).filter(c=>c.freq===f);
const eligible=c=>c.assign.kids.filter(id=>kid(id));
const isParent=()=>S.me?.role==='parent';

/* ---------- slot model ---------- */
function mk(c,wk,extra){return Object.assign({chore:c,wk,points:c.points},extra)}
function dailySlots(c,date){
  if(!c.days.includes(dow(date)))return[];
  const ks=eligible(c);if(!ks.length)return[];const wk=weekKey(date);
  if(c.assign.mode==='rotate'){const k=ks[(dayNum(date)+c.assign.start)%ks.length];return[mk(c,wk,{id:`${date}~${c.id}~${k}`,kid:k,date})]}
  if(c.assign.mode==='shared'&&ks.length>1)return[mk(c,wk,{id:`${date}~${c.id}~s~1`,kid:null,shared:true,eligible:ks,date})];
  return ks.map(k=>mk(c,wk,{id:`${date}~${c.id}~${k}`,kid:k,date}));
}
function weeklySlots(c,wk){
  const ks=eligible(c);if(!ks.length)return[];const t=c.times;
  if(c.assign.mode==='rotate'){const k=ks[(weekIdx(wk)+c.assign.start)%ks.length];return range(t).map(n=>mk(c,wk,{id:`w~${c.id}~${k}~${n+1}`,kid:k,n:n+1}))}
  if(c.assign.mode==='shared'&&ks.length>1)return range(t).map(n=>mk(c,wk,{id:`w~${c.id}~s~${n+1}`,kid:null,shared:true,eligible:ks,n:n+1}));
  return ks.flatMap(k=>range(t).map(n=>mk(c,wk,{id:`w~${c.id}~${k}~${n+1}`,kid:k,n:n+1})));
}
const dailyOn=date=>choresOf('daily').flatMap(c=>dailySlots(c,date));
const mine=(s,K)=>s.shared?s.eligible.includes(K):s.kid===K;
const docOf=s=>S.weeks[s.wk]?.docs.get(s.id);
const isDone=s=>docOf(s)?.status==='done';
function share(s,K){return s.shared?(s.eligible.includes(K)?s.points/s.eligible.length:0):(s.kid===K?s.points:0)}
function possible(K,wk){let p=0;weekDays(wk).forEach(d=>dailyOn(d).forEach(s=>p+=share(s,K)));choresOf('weekly').forEach(c=>weeklySlots(c,wk).forEach(s=>p+=share(s,K)));return p}
function earned(K,wk){let e=0;S.weeks[wk]?.docs.forEach(d=>{if(d.status==='done'&&d.kid===K)e+=Number(d.points)||0});return e}
function pay(K,wk){const k=kid(K),p=possible(K,wk),e=earned(K,wk);if(!k||!p)return{pct:0,amt:0,earned:e,possible:p};const pct=Math.min(1,e/p);return{pct,amt:k.allowance*pct,earned:e,possible:p}}
function dayProg(K,date){const sl=dailyOn(date).filter(s=>!s.shared&&s.kid===K);return{total:sl.length,done:sl.filter(isDone).length}}
function streak(K){
  let n=0,d=dayNum(today()),t=d;
  for(let i=0;i<180;i++,d--){
    const k=fromNum(d),wk=weekKey(k);
    if(!S.weeks[wk]?.loaded){ensureWeek(wk);break}
    const p=dayProg(K,k);if(!p.total)continue;
    if(p.done===p.total)n++;else if(d!==t)break;
  }return n;
}

/* ---------- data sync (Google Sheet via Apps Script) ---------- */
function ensureWeek(wk){if(!S.weeks[wk]?.loaded&&!S.need.has(wk)){S.need.add(wk);clearTimeout(S.fetchT);S.fetchT=setTimeout(()=>refresh(),30)}}
function applyState(st){
  S.me=st.me;S.cfg=norm(st.cfg);
  Object.keys(st.weeks).forEach(wk=>{
    const m=new Map();st.weeks[wk].forEach(r=>m.set(r.id,r));
    S.pend.forEach((v,key)=>{const [w,id]=key.split('|');if(w===wk){v?m.set(id,v):m.delete(id)}});
    S.weeks[wk]={docs:m,loaded:true};S.need.delete(wk);
    S.meta[wk]={paid:st.paid[wk]||{}};
  });
}
async function refresh(force){
  if(!S.cred||S.loading)return;
  const cur=weekKey(today()),view=weekKey(S.date);
  const ask=new Set([cur,view,...S.need]);
  if(!force)[...ask].forEach(w=>{if(w!==cur&&w!==view&&S.weeks[w]?.loaded)ask.delete(w)});
  S.loading=true;
  try{const st=await call('getState',S.cred,[...ask]);S.offline=false;applyState(st);render();if(S.modal)renderModal()}
  catch(e){const m=errMsg(e);if(/PIN/.test(m)){logout(m)}else{S.offline=true;render()}}
  finally{S.loading=false;if(S.need.size&&[...S.need].some(w=>!ask.has(w)))setTimeout(()=>refresh(),30)}
}
async function writeDone(wk,id,data){
  const key=wk+'|'+id;
  if(!S.weeks[wk])S.weeks[wk]={docs:new Map(),loaded:false};
  data?S.weeks[wk].docs.set(id,data):S.weeks[wk].docs.delete(id);S.pend.set(key,data);render();
  try{await call('setDone',S.cred,wk,id,data);S.pend.delete(key)}
  catch(e){S.pend.delete(key);toast(errMsg(e)||'Didn\'t save — check connection');refresh(true)}
}
function saveCfg(){
  const snap=clone(S.cfg);delete snap.defaultPins;
  S.cfgQ=S.cfgQ.then(()=>call('saveConfig',S.cred,snap)).then(c=>{S.cfg.defaultPins=c.defaultPins;render()}).catch(e=>{toast(errMsg(e));refresh(true)});
}
async function togglePaid(w,K){
  const m=S.meta[w]||{paid:{}};const v=!m.paid[K];m.paid={...m.paid,[K]:v};S.meta[w]=m;render();
  try{await call('setPaid',S.cred,w,K,v)}catch(e){toast(errMsg(e));refresh(true)}
}

/* ---------- login ---------- */
async function loadProfiles(){try{S.profiles=await call('getProfiles');render()}catch(e){S.profiles={kids:[],parents:[],err:errMsg(e)};render()}}

function logout(msg){S.cred=null;S.me=null;S.cfg=null;S.weeks={};S.meta={};S.pend.clear();ls.set('cq.cred',null);ls.set('cq.view',null);S.login={who:'',pin:'',bad:msg||'',busy:false};render();loadProfiles()}

/* ---------- actions ---------- */
function toggle(id,K,ev){
  const s=S.slotIdx.get(id);if(!s)return;
  if(!isParent()&&K!==S.me.id)return toast(`This is ${kidName(K)}'s list 🙂`);
  const d=docOf(s),t=today();
  if(d&&d.status==='done'){
    if(s.shared&&d.kid!==K&&!isParent())return toast(`${kidName(d.kid)} already did this one 👍`);
    writeDone(s.wk,s.id,null);return;
  }
  if(s.date&&dayNum(s.date)>dayNum(t))return toast("That day hasn't happened yet! ⏳");
  if(!s.date&&dayNum(s.wk)>dayNum(t))return toast("That week hasn't started yet! ⏳");
  const inWeek=dayNum(t)>=dayNum(s.wk)&&dayNum(t)<dayNum(s.wk)+7;
  const data={id:s.id,week:s.wk,chore:s.chore.id,title:s.chore.title,kid:s.shared?K:s.kid,date:s.date||(inWeek?t:S.date),points:s.points,bonus:s.chore.freq==='bonus',status:'done',note:'',at:Date.now(),returnedAt:''};
  writeDone(s.wk,s.id,data);
  burst(ev?.clientX??innerWidth/2,ev?.clientY??innerHeight/2,26,kid(data.kid)?.color);
  setTimeout(()=>{
    if(s.date){const p=dayProg(data.kid,s.date);if(p.total&&p.done===p.total){bigCelebrate();toast(`All done for ${s.date===t?'today':DAYS[dow(s.date)]}! 🎉`)}}
    else{const all=choresOf('weekly').flatMap(c=>weeklySlots(c,s.wk)).filter(x=>!x.shared&&x.kid===data.kid);if(all.length&&all.every(isDone)){bigCelebrate();toast('Weekly Wonder unlocked! 🧺✨')}}
  },60);
}
function sendBack(wk,id,note){const d=S.weeks[wk]?.docs.get(id);if(!d)return;writeDone(wk,id,{...d,status:'returned',note:note||'Needs another look',returnedAt:Date.now()});toast(`Sent back to ${kidName(d.kid)}`)}
function setView(v){S.view=v;ls.set('cq.view',v);render();scrollTo(0,0)}
function shiftWeek(n){S.date=fromNum(dayNum(S.date)+7*n);render();refresh()}

/* ---------- rendering ---------- */
function isEditing(){const a=document.activeElement;return a&&$('#app').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
function render(){
  if(isEditing()){S.pending=true;return}
  S.slotIdx=new Map();
  const app=$('#app');
  if(!S.cred){app.innerHTML=loginView();return}
  let h=topBar();
  if(!S.cfg){app.innerHTML=h+`<div class="load"><div class="spin"></div>${S.offline?'Can\'t reach the chore list — check your connection.':'Loading chores…'}</div>`;return}
  if(S.offline)h+=`<div class="notice">Offline — showing the last update. Changes may not save.</div>`;
  if(isParent()&&S.cfg.defaultPins)h+=`<div class="notice">🔐 Some PINs are still the defaults. Change them in ⚙️ Parent → Kids and Settings.</div>`;
  h+=tabs();
  const v=S.view;
  if(v==='parent'&&isParent())h+=parentView();
  else if(kid(v))h+=kidView(v);
  else h+=familyView();
  app.innerHTML=h;
}
function topBar(){
  const me=S.me,k=kid(me.id),p=S.cfg?.parents?.find(x=>x.id===me.id);
  const em=k?.emoji||p?.emoji||'🧑',col=k?.color||'#64748B';
  return `<div class="top"><div class="brand">🏡 Chore Quest</div><button class="me" data-act="logout" title="Switch person"><span class="av" style="--c:${col}">${esc(em)}</span>${esc(me.name)} · Switch</button></div>`;
}
function tabs(){
  let h=`<div class="tabs"><button class="tab plain ${S.view==='family'?'on':''}" data-act="view" data-v="family">👨‍👩‍👧‍👧 Family</button>`;
  const ks=isParent()?kids():[kid(S.me.id),...kids().filter(k=>k.id!==S.me.id)].filter(Boolean);
  ks.forEach(k=>h+=`<button class="tab ${S.view===k.id?'on':''}" style="--c:${k.color}" data-act="view" data-v="${esc(k.id)}"><span class="av" style="--c:${k.color}">${esc(k.emoji)}</span>${esc(k.name)}</button>`);
  if(isParent())h+=`<button class="tab plain ${S.view==='parent'?'on':''}" data-act="view" data-v="parent">⚙️ Parent</button>`;
  return h+`</div>`;
}
function weekStrip(K,color){
  const wk=weekKey(S.date),t=today();
  let h=`<div class="week" style="--c:${color}"><button class="arrow" data-act="wk" data-n="-1">‹</button><div class="days">`;
  weekDays(wk).forEach(d=>{
    let dot='',pct=0;
    if(K){const p=dayProg(K,d);if(p.total&&dayNum(d)<=dayNum(t)){pct=Math.round(p.done/p.total*100);dot=pct===100?'full':pct>0?'part':''}}
    h+=`<button class="day ${d===S.date?'sel':''} ${d===t?'today':''} ${dayNum(d)>dayNum(t)?'future':''}" data-act="day" data-d="${d}"><div class="dn">${DAYS[dow(d)].slice(0,2)}</div><div class="dd">${Number(d.slice(8))}</div>${K?`<div class="dot ${dot}" style="--p:${pct}%"></div>`:''}</button>`;
  });
  return h+`</div><button class="arrow" data-act="wk" data-n="1">›</button></div>`;
}
function choreCard(s,K,c){
  S.slotIdx.set(s.id,s);const d=docOf(s);const done=d?.status==='done';const ret=d?.status==='returned';
  const other=s.shared&&done&&d.kid!==K;
  let sub=s.chore.note?esc(s.chore.note):'';
  if(s.shared)sub=(other?`Done by ${esc(kidName(d.kid))} ✓`:'Shared — whoever does it')+(sub?' · '+sub:'');
  return `<button class="chore ${done?'done':''} ${ret?'returned':''} ${other?'locked':''}" style="--c:${c}" data-act="tog" data-id="${esc(s.id)}">
    <div class="em">${esc(s.chore.emoji)}</div><div class="tx"><div class="t">${esc(s.chore.title)}</div>${sub?`<div class="n">${sub}</div>`:''}${ret?`<div class="ret">↩ Sent back: ${esc(d.note)}</div>`:''}</div>
    <span class="pts">+${s.points}⭐</span><div class="chk">${done?'✓':''}</div></button>`;
}
function multiCard(c,slots,K,color){
  if(slots.length===1)return choreCard(slots[0],K,color);
  slots.forEach(s=>S.slotIdx.set(s.id,s));
  const dn=slots.filter(isDone).length,all=dn===slots.length;
  const ret=slots.map(docOf).find(d=>d?.status==='returned');
  const sub=[c.note?esc(c.note):'',slots[0].shared?'Shared':'',`${dn}/${slots.length} this week`].filter(Boolean).join(' · ');
  return `<div class="chore ${all?'done':''} ${ret?'returned':''}" style="--c:${color}"><div class="em">${esc(c.emoji)}</div><div class="tx"><div class="t">${esc(c.title)}</div><div class="n">${sub}</div>${ret?`<div class="ret">↩ Sent back: ${esc(ret.note)}</div>`:''}</div>
    <div class="slots">${slots.map(s=>{const d=docOf(s),on=d?.status==='done',oth=on&&s.shared&&d.kid!==K;return `<button class="slot ${on?(oth?'other':'on'):''} ${d?.status==='returned'?'ret':''}" data-act="tog" data-id="${esc(s.id)}" title="+${s.points}⭐">${oth?esc(kid(d.kid)?.emoji||'✓'):on?'✓':d?.status==='returned'?'↩':''}</button>`}).join('')}</div></div>`;
}
function kidView(K){
  const k=kid(K),wk=weekKey(S.date),t=today();ensureWeek(wk);

    <div class="stats"><div class="stat"><b>🔥 ${st}</b><span>day streak</span></div><div class="stat"><b>⭐ ${p.earned}</b><span>stars this week</span></div><div class="stat"><b>${Math.round(p.pct*100)}%</b><span>of goal</span></div></div>
    <div class="money"><div class="lbl"><span>💰 Allowance earned</span><span>${money(p.amt)} / ${money(k.allowance)}</span></div><div class="bar"><i style="width:${p.pct*100}%"></i></div></div></div>`;

  const wkItems=choresOf('weekly').map(c=>({c,sl:weeklySlots(c,wk).filter(s=>mine(s,K))})).filter(x=>x.sl.length);
  const wDone=wkItems.reduce((a,x)=>a+x.sl.filter(isDone).length,0),wTot=wkItems.reduce((a,x)=>a+x.sl.length,0);

}
function badges(K,wk,st,p){
  const t=today();let perfect=0;weekDays(wk).forEach(d=>{if(dayNum(d)<=dayNum(t)){const x=dayProg(K,d);if(x.total&&x.done===x.total)perfect++}});
  const reg=choresOf('weekly').flatMap(c=>weeklySlots(c,wk)).filter(s=>!s.shared&&s.kid===K);
  const bonusDone=[...(S.weeks[wk]?.docs.values()||[])].some(d=>d.bonus&&d.kid===K&&d.status==='done');
  const list=[['⭐',perfect?`Perfect day ×${perfect}`:'Perfect day',perfect>0],['🔥','3-day streak',st>=3],['🏆','7-day streak',st>=7],['👑','14-day streak',st>=14],
    ['🧺','Weekly Wonder',reg.length>0&&reg.every(isDone)],['💪','Above & beyond',bonusDone],['🌈','Perfect week',perfect===7],['💰','Full allowance',p.pct>=1]];
  return `<div class="badges">${list.map(([e,n,on])=>`<div class="badge ${on?'':'off'}"><span class="e">${e}</span>${esc(n)}</div>`).join('')}</div>`;
}

    h+=`<div class="sec"><h3>🔎 Recent check-offs</h3><span class="meta">parents only</span></div><div class="card feed">`;
    h+=docs.length?docs.map(([id,d])=>{const k=kid(d.kid);return `<div class="it"><span class="av" style="--c:${k?.color||'#999'}">${esc(k?.emoji||'?')}</span><div class="w">${esc(d.title)}<small>${esc(kidName(d.kid))} · ${new Date(Number(d.at)).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'})}${d.status==='returned'?' · ↩ sent back':''}</small></div>${d.status==='done'?`<button class="btn sm bad" data-act="ret" data-wk="${wk}" data-id="${esc(id)}">Send back</button>`:''}</div>`}).join(''):`<div class="empty">No check-offs yet this week.</div>`;
    h+=`</div>`;
  }
  return h;
}
/* ---------- parent ---------- */
function parentView(){
  const t=S.ptab;
  let h=`<div class="ptabs">${[['chores','📝 Chores'],['kids','👧 Kids'],['money','💰 Pay'],['set','⚙️ Settings']].map(([k,l])=>`<button class="${t===k?'on':''}" data-act="ptab" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(t==='chores')h+=pChores();else if(t==='kids')h+=pKids();else if(t==='money')h+=pMoney();else h+=pSettings();
  return h;
}
function whoText(c){const ks=eligible(c).map(kidName);if(!ks.length)return'Nobody assigned';if(ks.length===1)return ks[0];
  return c.assign.mode==='rotate'?`Take turns: ${ks.join(' → ')}`:c.assign.mode==='shared'?`Shared: ${ks.join(' or ')}`:`Each: ${ks.join(' & ')}`}
function freqText(c){if(c.freq==='daily')return c.days.length===7?'Every day':c.days.map(d=>DAYS[d]).join(' ');return `${c.times}× per week`}
function pChores(){
  let h=`<button class="btn pri block" data-act="addchore" style="margin-bottom:14px">＋ Add a chore</button>`;
  [['daily','☀️ Daily'],['weekly','📅 Weekly'],['bonus','💪 Bonus (extra stars)']].forEach(([f,l])=>{
    const list=choresOf(f);h+=`<div class="card"><div class="grp">${l}</div>`;
    h+=list.length?list.map(c=>`<div class="prow"><div class="mv"><button data-act="mv" data-id="${esc(c.id)}" data-n="-1">▲</button><button data-act="mv" data-id="${esc(c.id)}" data-n="1">▼</button></div><div class="em">${esc(c.emoji)}</div><div class="tx"><div class="t">${esc(c.title)}</div><div class="n">${esc(freqText(c))} · ${esc(whoText(c))} · ${c.points}⭐</div></div><button class="btn sm" data-act="editchore" data-id="${esc(c.id)}">Edit</button></div>`).join(''):`<div class="empty">None yet</div>`;
    h+=`</div>`});
  return h;
}
function pKids(){
  let h=`<div class="card">`;
  kids().forEach((k,i)=>{h+=`<div class="kidedit" style="--c:${k.color}"><div class="r"><span class="av" style="--c:${k.color};width:44px;height:44px;font-size:24px">${esc(k.emoji)}</span>
    <input class="inp" style="flex:1;min-width:120px" value="${esc(k.name)}" data-kf="name" data-i="${i}" placeholder="Name"></div>
    <div class="r"><span class="muted" style="font-weight:800">Allowance $</span><input class="inp" style="width:84px" type="number" min="0" step="0.5" value="${k.allowance}" data-kf="allowance" data-i="${i}"><span class="muted" style="font-size:12px;font-weight:800">/wk</span>
    <span class="spacer"></span><span class="muted" style="font-weight:800">PIN</span><input class="inp" style="width:76px" inputmode="numeric" maxlength="4" value="${esc(k.pin||'')}" data-kf="pin" data-i="${i}"></div>
    <div class="r">${COLORS.map(c=>`<button class="sw ${c===k.color?'on':''}" style="background:${c}" data-act="kcolor" data-i="${i}" data-c="${c}"></button>`).join('')}</div>
    <div class="emogrid">${KID_EMOJI.map(e=>`<button class="${e===k.emoji?'on':''}" data-act="kemoji" data-i="${i}" data-e="${e}">${e}</button>`).join('')}</div>
    <div style="text-align:right;margin-top:8px"><button class="btn sm bad" data-act="delkid" data-i="${i}">Remove</button></div></div>`});
  h+=`<button class="btn block" data-act="addkid">＋ Add a kid</button></div>`;
  return h;
}
function pMoney(){
  const cur=weekKey(today());const wks=range(6).map(i=>fromNum(dayNum(cur)-7*i));
  wks.forEach(w=>ensureWeek(w));
  let h=`<div class="card"><p class="muted" style="margin-top:0;font-weight:700;font-size:14px">Allowance = weekly amount × share of stars earned (bonus stars help make up misses, capped at 100%). Tap to mark paid. Full history is in the Google Sheet.</p><table class="al"><tr><th>Week of</th>${kids().map(k=>`<th>${esc(k.emoji)} ${esc(k.name)}</th>`).join('')}</tr>`;
  wks.forEach(w=>{const ld=S.weeks[w]?.loaded;h+=`<tr><td>${shortDate(w)}${w===cur?'<br><small class="muted">this week</small>':''}</td>`;
    kids().forEach(k=>{if(!ld){h+=`<td class="muted">…</td>`;return}const x=pay(k.id,w),pd=!!S.meta[w]?.paid?.[k.id];
      h+=`<td>${money(x.amt)} <small class="muted">${Math.round(x.pct*100)}%</small><br><button class="paid ${pd?'on':''}" data-act="paid" data-wk="${w}" data-k="${esc(k.id)}">${pd?'✓ Paid':'Mark paid'}</button></td>`});h+=`</tr>`});
  return h+`</table></div>`;
}
function pSettings(){
  const s=S.cfg.settings;
  return `<div class="card">
   <div class="field"><label>Family reward</label><input class="inp" data-sf="reward" value="${esc(s.reward)}"></div>
   <div class="field"><label>Family goal — % of all chores</label><div class="step"><button data-act="goal" data-n="-5">−</button><b>${s.goalPct}%</b><button data-act="goal" data-n="5">＋</button></div></div>
   <div class="field"><label>Week starts on</label><div class="seg">${[0,1].map(d=>`<button class="${s.weekStart===d?'on':''}" data-act="wstart" data-n="${d}">${d?'Monday':'Sunday'}</button>`).join('')}</div><div class="muted" style="font-size:12px;font-weight:700;margin-top:6px">Changing this mid-way re-groups past check-offs; best set once.</div></div></div>
   <div class="card"><div class="grp" style="margin:0 0 8px">Parents</div>
   ${S.cfg.parents.map((p,i)=>`<div class="kidedit"><div class="r"><span style="font-size:26px">${esc(p.emoji||'🧑')}</span><input class="inp" style="flex:1;min-width:110px" value="${esc(p.name)}" data-pf="name" data-i="${i}">
     <span class="muted" style="font-weight:800">PIN</span><input class="inp" style="width:76px" inputmode="numeric" maxlength="4" value="${esc(p.pin||'')}" data-pf="pin" data-i="${i}"></div>
     <div class="row"><div class="emogrid" style="flex:1">${PARENT_EMOJI.map(e=>`<button class="${e===p.emoji?'on':''}" data-act="pemoji" data-i="${i}" data-e="${e}">${e}</button>`).join('')}</div>${S.cfg.parents.length>1&&p.id!==S.me.id?`<button class="btn sm bad" data-act="delparent" data-i="${i}">Remove</button>`:''}</div></div>`).join('')}
   <button class="btn block" data-act="addparent">＋ Add a parent</button>
   <div class="muted" style="font-size:12px;font-weight:700;margin-top:10px">Everyone needs a different 4-digit PIN. PINs keep the kids out of parent tools — a family lock, not bank-grade security.</div></div>`;
}
/* ---------- modals ---------- */
function openChore(c){
  S.modal={type:'chore',draft:c?clone(c):{id:'c'+Date.now().toString(36),title:'',note:'',emoji:'✨',freq:'daily',days:[0,1,2,3,4,5,6],times:1,points:1,assign:{mode:'each',kids:kids().map(k=>k.id),start:0}},isNew:!c};renderModal();
}
function rotNow(d,ks){const n=d.freq==='daily'?dayNum(today()):weekIdx(weekKey(today()));return ks[(n+(d.assign.start||0))%ks.length]}
function renderModal(){
  const M=S.modal,el=$('#modal');if(!M){el.innerHTML='';return}
  let h='';
  if(M.type==='chore'){const d=M.draft;const ks=d.assign.kids.filter(id=>kid(id));
    h=`<h3>${M.isNew?'New chore':'Edit chore'}<button class="iconbtn" data-act="close">✕</button></h3>
    <div class="field"><label>Chore</label><input class="inp" data-df="title" value="${esc(d.title)}" placeholder="e.g. Feed the dog"></div>
    <div class="field"><label>Note / standard (optional)</label><input class="inp" data-df="note" value="${esc(d.note)}" placeholder="e.g. Put away, not just brought upstairs!"></div>
    <div class="field"><label>Icon</label><div class="emogrid">${CHORE_EMOJI.map(e=>`<button class="${e===d.emoji?'on':''}" data-act="demoji" data-e="${e}">${e}</button>`).join('')}</div></div>
    <div class="field"><label>How often</label><div class="seg">${[['daily','☀️ Daily'],['weekly','📅 Weekly'],['bonus','💪 Bonus']].map(([f,l])=>`<button class="${d.freq===f?'on':''}" data-act="dfreq" data-v="${f}">${l}</button>`).join('')}</div></div>
    ${d.freq==='daily'?`<div class="field"><label>Which days</label><div class="seg">${range(7).map(i=>{const x=(i+ws())%7;return `<button class="${d.days.includes(x)?'on':''}" data-act="dday" data-n="${x}">${DAYS[x]}</button>`}).join('')}</div></div>`
      :`<div class="field"><label>Times per week</label><div class="step"><button data-act="dtimes" data-n="-1">−</button><b>${d.times}</b><button data-act="dtimes" data-n="1">＋</button></div></div>`}
    <div class="field"><label>Stars ${d.freq==='daily'?'each day':'each time'}</label><div class="step"><button data-act="dpts" data-n="-1">−</button><b>${d.points}⭐</b><button data-act="dpts" data-n="1">＋</button></div></div>
    <div class="field"><label>Who</label><div class="seg">${kids().map(k=>`<button class="${ks.includes(k.id)?'on':''}" style="--c:${k.color}" data-act="dkid" data-v="${esc(k.id)}">${esc(k.emoji)} ${esc(k.name)}</button>`).join('')}</div></div>
    ${ks.length>1?`<div class="field"><label>How it's split</label><div class="seg">${[['each','Each kid does it'],['rotate','Take turns'],['shared','Whoever does it']].map(([m,l])=>`<button class="${d.assign.mode===m?'on':''}" data-act="dmode" data-v="${m}">${l}</button>`).join('')}</div>
      <div class="muted" style="font-size:12px;font-weight:700;margin-top:6px">${d.assign.mode==='rotate'?`Alternates ${d.freq==='daily'?'each day':'each week'}.`:d.assign.mode==='shared'?'One shared job — stars go to whoever checks it off.':'Everyone gets their own copy.'}</div></div>
      ${d.assign.mode==='rotate'?`<div class="field"><label>Whose turn is it ${d.freq==='daily'?'today':'this week'}?</label><div class="seg">${ks.map(id=>{const k=kid(id);return `<button class="${rotNow(d,ks)===id?'on':''}" style="--c:${k.color}" data-act="drot" data-v="${esc(id)}">${esc(k.emoji)} ${esc(k.name)}</button>`}).join('')}</div></div>`:''}`:''}
    <div class="row" style="margin-top:6px">${M.isNew?'':`<button class="btn bad" data-act="delchore">Delete</button>`}<span class="spacer"></span><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="savechore">Save</button></div>`;
  } else if(M.type==='ret'){
    const d=S.weeks[M.wk]?.docs.get(M.id);
    h=`<h3>Send back<button class="iconbtn" data-act="close">✕</button></h3><p style="font-weight:700;margin-top:0">${esc(d?.title)} — ${esc(kidName(d?.kid))}</p>
    <div class="field"><label>What needs fixing?</label><input class="inp" id="retnote" placeholder="e.g. Put it away, not just upstairs"><div class="chips">${RETURN_REASONS.map(r=>`<button data-act="retchip" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <div class="row"><span class="spacer"></span><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="retgo">Send back</button></div>`;
  } else if(M.type==='confirm'){
    h=`<h3>${esc(M.title)}</h3><p style="font-weight:700">${esc(M.body)}</p><div class="row"><span class="spacer"></span><button class="btn" data-act="close">Cancel</button><button class="btn bad" data-act="confirmgo">${esc(M.ok||'Delete')}</button></div>`;
  }
  el.innerHTML=`<div class="bg" data-act="bgclose"><div class="sheet">${h}</div></div>`;
}
function closeModal(){S.modal=null;renderModal()}
function pinsOk(){const all=[...S.cfg.kids.map(k=>k.pin),...S.cfg.parents.map(p=>p.pin)];if(all.some(p=>!/^\d{4}$/.test(p||''))){toast('Every PIN must be 4 digits');return false}if(new Set(all).size!==all.length){toast('Each person needs a different PIN');return false}return true}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,M=S.modal;
  if(a==='bgclose'){if(e.target===b)closeModal();return}
  switch(a){
    case 'pick':S.login.who=b.dataset.v;S.login.pin='';S.login.bad='';render();break;
    case 'lpin':{const L=S.login,v=b.dataset.v;if(L.busy)break;if(v==='←'){L.who='';L.pin='';L.bad=''}else if(v==='⌫')L.pin=L.pin.slice(0,-1);else if(L.pin.length<4)L.pin+=v;L.bad&&v!=='←'&&(L.bad='');render();if(L.pin.length===4)tryLogin();break}
    case 'logout':logout();break;
    case 'view':setView(b.dataset.v);break;
    case 'day':S.date=b.dataset.d;render();break;
    case 'wk':shiftWeek(+b.dataset.n);break;
    case 'tog':toggle(b.dataset.id,S.view,e);break;
    case 'ret':S.modal={type:'ret',wk:b.dataset.wk,id:b.dataset.id};renderModal();break;
    case 'retchip':$('#retnote').value=b.dataset.v;break;
    case 'retgo':sendBack(M.wk,M.id,$('#retnote').value.trim());closeModal();break;
    case 'close':closeModal();break;
    case 'ptab':S.ptab=b.dataset.v;render();break;
    case 'addchore':openChore(null);break;
    case 'editchore':openChore(S.cfg.chores.find(c=>c.id===b.dataset.id));break;
    case 'mv':{const cs=S.cfg.chores,i=cs.findIndex(c=>c.id===b.dataset.id),n=+b.dataset.n;let j=i+n;while(j>=0&&j<cs.length&&cs[j].freq!==cs[i].freq)j+=n;if(j>=0&&j<cs.length){[cs[i],cs[j]]=[cs[j],cs[i]];saveCfg();render()}break}
    case 'demoji':M.draft.emoji=b.dataset.e;renderModal();break;
    case 'dfreq':M.draft.freq=b.dataset.v;renderModal();break;
    case 'dday':{const n=+b.dataset.n,ds=M.draft.days;M.draft.days=ds.includes(n)?ds.filter(x=>x!==n):[...ds,n].sort();renderModal();break}
    case 'dtimes':M.draft.times=Math.min(14,Math.max(1,M.draft.times+ +b.dataset.n));renderModal();break;
    case 'dpts':M.draft.points=Math.min(50,Math.max(0,M.draft.points+ +b.dataset.n));renderModal();break;
    case 'dkid':{const v=b.dataset.v,k=M.draft.assign.kids;M.draft.assign.kids=k.includes(v)?k.filter(x=>x!==v):kids().map(x=>x.id).filter(id=>id===v||k.includes(id));renderModal();break}
    case 'dmode':M.draft.assign.mode=b.dataset.v;renderModal();break;
    case 'drot':{const d=M.draft,ks=d.assign.kids.filter(id=>kid(id)),n=d.freq==='daily'?dayNum(today()):weekIdx(weekKey(today()));const want=ks.indexOf(b.dataset.v);d.assign.start=((want-n)%ks.length+ks.length)%ks.length;renderModal();break}
    case 'savechore':{const d=M.draft;d.title=d.title.trim();if(!d.title)return toast('Give the chore a name');if(d.freq==='daily'&&!d.days.length)return toast('Pick at least one day');if(!d.assign.kids.length)return toast('Pick who does it');
      const cs=S.cfg.chores,i=cs.findIndex(c=>c.id===d.id);if(i>=0)cs[i]=d;else cs.push(d);saveCfg();closeModal();render();toast('Saved ✓');break}
    case 'delchore':S.modal={type:'confirm',title:'Delete chore?',body:`"${M.draft.title}" will be removed. Past check-offs still count.`,go:()=>{S.cfg.chores=S.cfg.chores.filter(c=>c.id!==M.draft.id);saveCfg();render()}};renderModal();break;
    case 'confirmgo':{const g=M.go;closeModal();g&&g();break}
    case 'kcolor':S.cfg.kids[+b.dataset.i].color=b.dataset.c;saveCfg();render();break;
    case 'kemoji':S.cfg.kids[+b.dataset.i].emoji=b.dataset.e;saveCfg();render();break;
    case 'pemoji':S.cfg.parents[+b.dataset.i].emoji=b.dataset.e;saveCfg();render();break;
    case 'addkid':{const n=kids().length;let pin;do{pin=String(Math.floor(1000+Math.random()*9000))}while([...S.cfg.kids,...S.cfg.parents].some(x=>x.pin===pin));
      S.cfg.kids.push({id:'kid'+Date.now().toString(36),name:'New kid',emoji:KID_EMOJI[n%KID_EMOJI.length],color:COLORS[n%COLORS.length],allowance:10,pin});saveCfg();render();toast(`New kid's PIN is ${pin}`);break}
    case 'addparent':{let pin;do{pin=String(Math.floor(1000+Math.random()*9000))}while([...S.cfg.kids,...S.cfg.parents].some(x=>x.pin===pin));
      S.cfg.parents.push({id:'p'+Date.now().toString(36),name:'Parent',emoji:'🧑',pin});saveCfg();render();toast(`New parent's PIN is ${pin}`);break}
    case 'delkid':{const k=S.cfg.kids[+b.dataset.i];S.modal={type:'confirm',title:`Remove ${k.name}?`,body:'They\'ll be taken off all chores. Past check-offs are kept in the Sheet.',ok:'Remove',go:()=>{S.cfg.kids=S.cfg.kids.filter(x=>x.id!==k.id);S.cfg.chores.forEach(c=>c.assign.kids=c.assign.kids.filter(x=>x!==k.id));saveCfg();render()}};renderModal();break}
    case 'delparent':{const p=S.cfg.parents[+b.dataset.i];S.modal={type:'confirm',title:`Remove ${p.name}?`,body:'They won\'t be able to sign in anymore.',ok:'Remove',go:()=>{S.cfg.parents=S.cfg.parents.filter(x=>x.id!==p.id);saveCfg();render()}};renderModal();break}
    case 'paid':togglePaid(b.dataset.wk,b.dataset.k);break;
    case 'goal':S.cfg.settings.goalPct=Math.min(100,Math.max(10,S.cfg.settings.goalPct+ +b.dataset.n));saveCfg();render();break;
    case 'wstart':S.cfg.settings.weekStart=+b.dataset.n;saveCfg();render();refresh(true);break;
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.df&&S.modal?.draft)S.modal.draft[t.dataset.df]=t.value});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.kf||t.dataset.pf){const list=t.dataset.kf?S.cfg.kids:S.cfg.parents,f=t.dataset.kf||t.dataset.pf,o=list[+t.dataset.i];const old=o[f];
    if(f==='allowance')o.allowance=Math.max(0,Number(t.value)||0);
    else if(f==='pin'){o.pin=t.value.replace(/\D/g,'').slice(0,4);if(!pinsOk()){o.pin=old;t.value=old;return}if(o.id===S.me.id){S.cred.pin=o.pin;ls.set('cq.cred',JSON.stringify(S.cred))}}
    else o.name=t.value.trim()||o.name;
    saveCfg();toast('Saved ✓')}
  if(t.dataset.sf){S.cfg.settings[t.dataset.sf]=t.value.trim();saveCfg();toast('Saved ✓')}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending&&!isEditing()){S.pending=false;render()}},50));

/* ---------- toast & confetti ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
const fx=$('#fx'),cx=fx.getContext('2d');let parts=[],raf=0;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}sizeFx();addEventListener('resize',sizeFx);
function burst(x,y,n,color){const pal=[color||'#7C5CFF','#FFB703','#FF5D8F','#22C55E','#3B82F6'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:.25,s:4+Math.random()*5,c:pal[i%pal.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:60+Math.random()*30})}
  if(!raf)raf=requestAnimationFrame(tick)}
function bigCelebrate(){for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*.35,40),i*140)}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0);
  parts.forEach(p=>{p.vy+=p.g;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

/* ---------- boot ---------- */
(function boot(){
  try{const c=JSON.parse(ls.get('cq.cred')||'null');if(c&&c.who&&c.pin)S.cred=c}catch(e){}
  if(S.cred&&BOOT.who&&BOOT.who!==S.cred.who)S.cred=null; // link for a different person
  if(S.cred){S.me={id:S.cred.who,name:'',role:'kid'};const v=ls.get('cq.view');if(v)S.view=v;render();refresh(true).then(()=>{if(S.me?.role==='kid'&&!ls.get('cq.view'))S.view=S.me.id;render()})}
  else{render();loadProfiles()}
  setInterval(()=>{if(S.cred&&document.visibilityState==='visible')refresh()},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=today();if(S._t!==t){if(S.date===S._t)S.date=t;S._t=t}refresh()}});
  S._t=today();
})();
</script>
</body>
